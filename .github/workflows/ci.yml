name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gi.slnx -c Release -m:1
      - run: dotnet test Gi.slnx -c Release --no-build
      - run: dotnet run --project samples/world -c Release --no-build
      - run: dotnet run --project benchmarks -c Release --no-build -- --verify
      - run: dotnet run --project benchmarks -c Release --no-build -- --verify
        env:
          DOTNET_EnableHWIntrinsic: "0"
      - run: dotnet pack src/Gi -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Gi.Validation -c Release --no-build -o artifacts/packages

  netstandard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Gi.Tests -c Release -m:1 -p:GiNetStandard=true
      - run: dotnet build benchmarks -c Release -m:1 -p:GiNetStandard=true
      - run: dotnet test tests/Gi.Tests -c Release --no-build -p:GiNetStandard=true
      - run: dotnet run --project benchmarks -c Release --no-build -p:GiNetStandard=true -- --verify

  determinism:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: avx512, os: ubuntu-latest, avx512: "1", avx2: "1", intrinsics: "1" }
          - { name: avx2, os: ubuntu-latest, avx512: "0", avx2: "1", intrinsics: "1" }
          - { name: sse, os: ubuntu-latest, avx512: "0", avx2: "0", intrinsics: "1" }
          - { name: scalar, os: ubuntu-latest, avx512: "1", avx2: "1", intrinsics: "0" }
          - { name: arm64, os: ubuntu-24.04-arm, avx512: "1", avx2: "1", intrinsics: "1" }
    name: determinism (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_EnableAVX512F: ${{ matrix.avx512 }}
      DOTNET_EnableAVX2: ${{ matrix.avx2 }}
      DOTNET_EnableHWIntrinsic: ${{ matrix.intrinsics }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gi.slnx -c Release -m:1
      - run: dotnet test tests/Gi.Tests -c Release --no-build --filter "FullyQualifiedName~GoldenCorpus|FullyQualifiedName~StreamDifferential"

  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x
      - name: Install the JetBrains inspectcode CLI
        run: dotnet tool install --global jetbrains.resharper.globaltools
      - name: Inspection sweep — any warning or error fails the build
        run: |
          jb inspectcode Gi.slnx --severity=WARNING --build --output=inspect.json
          python3 - <<'EOF'
          import json, sys
          results = [r for run in json.load(open('inspect.json'))['runs'] for r in run.get('results', [])]
          for r in results:
              loc = r['locations'][0]['physicalLocation']
              print(r['level'], r['ruleId'], loc['artifactLocation']['uri'], loc.get('region', {}).get('startLine'))
          sys.exit(f'{len(results)} inspection findings at warning severity or above' if results else 0)
          EOF
